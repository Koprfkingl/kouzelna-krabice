<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kouzelná krabice</title>
<link rel="stylesheet" href="styles.css">
<script src="tts-android.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.min.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scena"></canvas>

<div id="nacitani">
  <div class="logo">✨📦✨</div>
  <h1>Kouzelná krabice</h1>
  <div class="bar"><div id="nacitani-bar"></div></div>
  <button id="start" class="velke" hidden>▶ Hrát</button>
  <div id="verze" class="verze"></div>
</div>

<header id="horni">
  <button id="btn-album" class="kulate" aria-label="Sbírka příšerek">📖<span id="album-pocet">0</span></button>
  <div id="titulek">Kouzelná krabice</div>
  <button id="btn-zvuk" class="kulate" aria-label="Zvuk">🔊</button>
</header>
<button id="btn-aktualizace" class="aktualizace" hidden></button>

<div id="bublina" hidden></div>

<section id="panel">
  <!-- Krok 1: co dát před krabici -->
  <div id="krok-vyber" class="krok">
    <h2 id="vyber-nadpis">Co dáme před krabici?</h2>
    <nav class="zalozky" id="zalozky-zdroj"></nav>
    <div class="mrizka" id="mrizka-zdroj"></div>
  </div>

  <!-- Krok 2: jednotlivé kroky kouzla, každý jedním tlačítkem -->
  <div id="krok-akce" class="krok" hidden>
    <h2 id="akce-nadpis"></h2>
    <p id="zive-info" hidden>Živé bytosti krabice promění na <b>roztomilou příšerku</b>! Jakou? To je překvapení…</p>
    <div id="cil-volba" hidden>
      <nav class="zalozky" id="zalozky-cil"></nav>
      <div class="mrizka" id="mrizka-cil"></div>
    </div>
    <button id="btn-hlavni" class="velke hlavni"></button>
    <div class="radek tlacitka" id="akce-dalsi"></div>
  </div>
</section>

<div id="album" class="okno" hidden>
  <div class="okno-obsah">
    <div class="radek"><h2>Moje příšerky</h2><button id="album-zavrit" class="kulate">✕</button></div>
    <p class="napoveda">Klepni na příšerku a postav ji před krabici.</p>
    <div class="mrizka" id="album-mrizka"></div>
  </div>
</div>

<div id="foto-dotaz" class="okno" hidden>
  <div class="okno-obsah">
    <img id="foto-nahled" alt="">
    <h2>Co jsi vyfotila?</h2>
    <div class="mrizka tri">
      <button class="dlazdice" data-druh="zive"><span class="ikona">🐾</span>Něco živého</button>
      <button class="dlazdice" data-druh="veci"><span class="ikona">🧸</span>Věc</button>
      <button class="dlazdice" data-druh="stroje"><span class="ikona">⚙️</span>Stroj</button>
    </div>
    <button id="foto-zrusit" class="male">Zrušit</button>
  </div>
</div>

<div id="aktualizace" class="okno" hidden>
  <div class="okno-obsah">
    <h2>🎁 Nová verze</h2>
    <p id="aktualizace-text" class="napoveda"></p>
    <div class="radek tlacitka">
      <button id="aktualizace-ano" class="velke">Stáhnout</button>
      <button id="aktualizace-ne" class="velke druhe">Teď ne</button>
    </div>
  </div>
</div>

<input id="foto-vstup" type="file" accept="image/*" capture="environment" hidden>
<div id="blesk"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
